name: Upload Laundry Day to itch.io

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Butler
        uses: remarkablegames/setup-butler@v3

      - name: Upload game
        run: butler push . ShaneekahDigitalHub/laundry-day-and-clean-salon-challenge:html5
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
