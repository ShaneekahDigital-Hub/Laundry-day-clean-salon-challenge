name: Upload Laundry Day to itch.io

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Butler
        uses: remarkablegames/setup-butler@v3

      - name: Extract game files
        run: |
          mkdir game
          unzip laundry-day-deployed-snapshot.zip -d game
          find game -name index.html

      - name: Upload game
        run: butler push game ShaneekahDigitalHub/laundry-day-and-clean-salon-challenge:download
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
